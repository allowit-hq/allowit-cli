name: CLI
on:
  pull_request:
    paths:
      - ".github/actions/private-dependency/**"
      - "cli/**"
      - "scripts/**"
      - "docs/examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/cli.yml"
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/private-dependency
        with:
          repository: ${{ vars.PRIVATE_DEPENDENCY_REPOSITORY }}
          ssh-key: ${{ secrets[vars.PRIVATE_DEPENDENCY_KEY_SECRET] }}
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo fmt --all --check
      - run: cargo test --locked -p allowit-cli
      - run: cargo test --locked -p allowit-policy-template
      - run: cargo clippy --locked -p allowit-cli --all-targets -- -D warnings
