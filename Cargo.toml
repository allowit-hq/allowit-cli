[workspace]
resolver = "3"
members = ["cli", "cli/templates/policy"]

# Every package in this repository releases at this version.
[workspace.package]
version = "0.4.0"
repository = "https://github.com/allowit-hq/allowit-cli"

# Dependencies point one way: this CLI depends only on the AllowIt SDK. The
# SDK registers every vendor plugin and pins one core release, so the CLI
# never names a vendor crate and Cargo builds one copy of core.
[workspace.dependencies]
allowit-sdk = { git = "https://github.com/allowit-hq/allowit-sdk.git", rev = "8d64918dd9c2874f923065dbbb0e2cc711e0405e" }

# Every Allowit workspace uses this profile block, so a shared target directory
# builds each shared crate once. Release builds keep overflow checks, which the
# portable policy library requires, and the contract settings; the Wasm targets
# abort on panic by default.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
overflow-checks = true
strip = "symbols"
