[package]
name = "allowit-cli"
version.workspace = true
repository.workspace = true
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "The allowit command: policy requests, local key custody and portable policy tools"

[lib]
name = "allowit_cli"

[[bin]]
name = "allowit"
path = "src/main.rs"

[dependencies]
allowit-sdk = { workspace = true }
serde_json_canonicalizer = "0.3"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
libc = "0.2.190"
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.143", features = ["raw_value", "arbitrary_precision"] }
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy", "parsing"] }
toml = "0.9"
zeroize = "1.8.2"

[dev-dependencies]
# The test kit loops shared tests over every registered rail.
allowit-sdk = { workspace = true, features = ["testkit"] }
